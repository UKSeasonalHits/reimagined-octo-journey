<!doctype html>
<html><head><meta charset="utf-8"><title>Black & Gold Ambient</title><style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Inter,Arial,sans-serif}
canvas{display:block;width:100%;height:100%}
.hud{
 position:fixed;left:18px;bottom:16px;z-index:20;color:#f5e7b2cc;
 font-size:12px;letter-spacing:.14em;text-transform:uppercase;
 backdrop-filter: blur(8px);background:#00000055;border:1px solid #d8b04c33;
 padding:8px 10px;border-radius:999px;user-select:none
}
.hud b{color:#ffe08a}
</style></head>
<body><canvas id="c"></canvas><div class="hud"><b>Black & Gold Ambient</b> • F fullscreen • Calm luxury mood</div>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');
let W,H,t=0;
function R(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio}addEventListener('resize',R);R();

function loop(){
  t+=.007;
  let bg=g.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#050505');
  bg.addColorStop(.55,'#090806');
  bg.addColorStop(1,'#000000');
  g.fillStyle=bg;
  g.fillRect(0,0,W,H);

  // soft gold radial ambience
  let rg=g.createRadialGradient(W/2,H*.55,10,W/2,H*.55,Math.max(W,H)*.52);
  rg.addColorStop(0,'rgba(255,210,90,.14)');
  rg.addColorStop(.35,'rgba(185,120,20,.08)');
  rg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=rg;
  g.fillRect(0,0,W,H);

  // calm floating gold lines
  g.lineWidth=2;
  for(let i=0;i<8;i++){
    g.beginPath();
    for(let x=0;x<=W;x+=18){
      let y=H*(.18 + i*.085) + Math.sin(x*.004 + t*2 + i)*H*.016 + Math.sin(x*.0015 - t + i*.6)*H*.008;
      if(x===0) g.moveTo(x,y); else g.lineTo(x,y);
    }
    g.strokeStyle=`rgba(235,190,90,${.16 + i*.03})`;
    g.shadowBlur=12; g.shadowColor='rgba(230,185,90,.22)';
    g.stroke();
  }
  g.shadowBlur=0;

  // elegant arcs
  g.save();
  g.translate(W/2,H*.68);
  for(let i=0;i<7;i++){
    let r=120+i*46+Math.sin(t*2+i)*6;
    g.beginPath();
    g.arc(0,0,r,Math.PI*1.03,Math.PI*1.97);
    g.strokeStyle=`rgba(255,215,120,${.06 + i*.03})`;
    g.lineWidth=2;
    g.stroke();
  }
  g.restore();

  // tiny drifting particles
  for(let i=0;i<90;i++){
    let px=((i*97.1 + t*180)%(W+200))-100;
    let py=(Math.sin(i*33.7+t*.8)*.5+.5)*H;
    let s=1+(i%2);
    g.fillStyle='rgba(255,220,135,.22)';
    g.fillRect(px,py,s,s);
  }

  requestAnimationFrame(loop);
}
loop();
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.()})
</script></body></html>
