<!doctype html>
<html><head><meta charset="utf-8"><title>Golden Titan</title><style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Inter,Arial,sans-serif}
canvas{display:block;width:100%;height:100%}
.hud{
 position:fixed;left:18px;bottom:16px;z-index:20;color:#f5e7b2cc;
 font-size:12px;letter-spacing:.14em;text-transform:uppercase;
 backdrop-filter: blur(8px);background:#00000055;border:1px solid #d8b04c33;
 padding:8px 10px;border-radius:999px;user-select:none
}
.hud b{color:#ffe08a}
</style></head>
<body><canvas id="c"></canvas><div class="hud"><b>Golden Titan</b> • F fullscreen • Huge gold beams</div>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');
let W,H,t=0;
function R(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio}addEventListener('resize',R);R();

function beam(x, a, alpha, width){
  g.save();
  g.translate(x,H*0.08);
  g.rotate(a);
  let grad=g.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'rgba(255,245,200,.95)');
  grad.addColorStop(.15,'rgba(255,220,110,.9)');
  grad.addColorStop(.45,'rgba(255,190,40,.35)');
  grad.addColorStop(1,'rgba(255,150,0,0)');
  g.globalAlpha=alpha;
  g.fillStyle=grad;
  g.beginPath();
  g.moveTo(-width,0); g.lineTo(width,0);
  g.lineTo(width*7,H); g.lineTo(-width*7,H);
  g.closePath(); g.fill();
  g.restore();
}

function loop(){
  t+=.014;
  g.fillStyle='rgba(4,3,1,.26)';
  g.fillRect(0,0,W,H);

  let bg=g.createRadialGradient(W/2,H*.34,30,W/2,H*.45,Math.max(W,H)*.75);
  bg.addColorStop(0,'#5f3f00');
  bg.addColorStop(.25,'#2b1b00');
  bg.addColorStop(.65,'#080603');
  bg.addColorStop(1,'#000');
  g.fillStyle=bg;
  g.fillRect(0,0,W,H);

  for(let i=0;i<16;i++){
    let x=W*(i/15);
    let ang=Math.sin(t*1.6+i*.5)*.5 + (i-7.5)*.03;
    beam(x,ang,.13 + (i%3)*.03, 10 + (i%4)*5);
  }

  // Huge golden pillars
  for(let i=0;i<7;i++){
    let x=(i+0.5)*W/7, w=W/18;
    let h=H*(.22 + .12*Math.sin(t*2+i));
    let grd=g.createLinearGradient(0,H-h,0,H);
    grd.addColorStop(0,'#fff8d0');
    grd.addColorStop(.2,'#ffd45b');
    grd.addColorStop(.75,'#b56d00');
    grd.addColorStop(1,'#593300');
    g.fillStyle=grd;
    g.shadowBlur=35; g.shadowColor='rgba(255,200,60,.65)';
    g.fillRect(x-w/2,H-h,w,h);
  }
  g.shadowBlur=0;

  // Crown arcs
  g.save();
  g.translate(W/2,H*.18);
  for(let i=0;i<9;i++){
    let r=70+i*28+Math.sin(t*2+i)*8;
    g.beginPath();
    g.arc(0,0,r,Math.PI*.08,Math.PI*.92);
    g.strokeStyle=`hsla(${42+i*2},100%,${74-i}%,.4)`;
    g.lineWidth=3 + (i%2)*2;
    g.shadowBlur=18; g.shadowColor='rgba(255,210,90,.7)';
    g.stroke();
  }
  g.restore();
  g.shadowBlur=0;

  // Spark particles
  for(let i=0;i<140;i++){
    let px=(Math.sin(i*77.7+t*1.4)*.5+.5)*W;
    let py=(Math.cos(i*44.2+t*2.1)*.5+.5)*H*.86;
    let s=1+(i%3);
    g.fillStyle='rgba(255,220,120,.5)';
    g.fillRect(px,py,s,s);
  }

  requestAnimationFrame(loop);
}
loop();
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.()})
</script></body></html>
